<!DOCTYPE html>
<html>
<head>
<style>
  body { background: black; color: white; padding: 20px; font-family: sans-serif; }
  .rich { border: 1px solid white; padding: 10px; }
  .rich ul { list-style-type: disc; padding-left: 20px; }
  .rich ol { list-style-type: decimal; padding-left: 20px; }
</style>
</head>
<body>
<div contenteditable="true" class="rich" id="ed">
  <div style="display: flex; gap: 1rem; margin: 0.5rem 0; width: 100%; align-items: stretch; word-break: break-word;">
    <div style="width: 50%; min-width: 15%; max-width: 85%; resize: horizontal; overflow: auto; padding: 0.5rem; border: 1px dashed #666; min-height: 2rem;">
      <div>Coluna 1</div>
    </div>
    <div style="flex: 1; padding: 0.5rem; border: 1px dashed #666; min-height: 2rem; overflow: auto;">
      <div>Coluna 2</div>
    </div>
  </div>
</div>
<button onmousedown="event.preventDefault(); document.execCommand('insertUnorderedList')">List</button>
</body>
</html>
