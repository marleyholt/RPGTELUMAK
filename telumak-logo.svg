<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="60%" stop-color="#e5a93b" />
      <stop offset="100%" stop-color="#ffcf40" />
    </linearGradient>
  </defs>

  <!-- Background Circle / Plate -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGlow)" />

  <!-- Inner Split Circle Background (Stone left, dark right) -->
  <g transform="translate(0, 20)">
    <!-- Left Half: Light stone texture -->
    <path d="M 250,110 A 130,130 0 0,0 250,370 Z" fill="#cfcfcb" />
    <!-- Right Half: Dark stone -->
    <path d="M 250,110 A 130,130 0 0,1 250,370 Z" fill="#3a4146" />

    <!-- Tree Roots (Lower Half) -->
    <!-- Left Roots (Dark on Light) -->
    <path d="M 250,240 
             C 245,260 230,270 220,290
             C 210,310 185,325 170,335
             M 220,290 C 230,310 235,335 230,355
             M 240,250 C 235,275 200,300 185,315
             M 245,260 C 250,290 245,320 245,360
             M 205,295 C 190,305 180,310 165,312
             M 225,320 C 210,335 200,345 190,350" 
          stroke="#1e2225" stroke-width="5" stroke-linecap="round" fill="none" />
    
    <!-- Right Roots (Light on Dark) -->
    <path d="M 250,240 
             C 255,260 270,270 280,290
             C 290,310 315,325 330,335
             M 280,290 C 270,310 265,335 270,355
             M 260,250 C 265,275 300,300 315,315
             M 255,260 C 250,290 255,320 255,360
             M 295,295 C 310,305 320,310 335,312
             M 275,320 C 290,335 300,345 310,350" 
          stroke="#cfcfcb" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Center dividing root line -->
    <path d="M 250,240 L 250,365" stroke="#d4af37" stroke-width="3" stroke-linecap="round" />

    <!-- Fire Flames (Upper Half) -->
    <!-- Main Center Flame -->
    <path d="M 250,240 
             C 240,220 235,190 245,160 
             C 248,150 250,135 250,120 
             C 252,140 256,155 255,165 
             C 265,195 260,220 250,240 Z" 
          fill="url(#fireGrad)" />
    <!-- Left Flame Tongue -->
    <path d="M 245,240 
             C 230,225 215,200 220,175 
             C 222,165 220,155 215,145 
             C 225,155 235,175 235,195 
             C 235,210 242,230 245,240 Z" 
          fill="url(#fireGrad)" />
    <!-- Outer Left Flame -->
    <path d="M 235,240 
             C 220,230 200,210 205,185 
             C 207,175 205,165 200,155 
             C 210,165 220,190 220,210 
             C 220,225 230,235 235,240 Z" 
          fill="url(#fireGrad)" />
    <!-- Right Flame Tongue -->
    <path d="M 255,240 
             C 270,225 285,200 280,175 
             C 278,165 280,155 285,145 
             C 275,155 265,175 265,195 
             C 265,210 258,230 255,240 Z" 
          fill="url(#fireGrad)" />
    <!-- Outer Right Flame -->
    <path d="M 265,240 
             C 280,230 300,210 295,185 
             C 293,175 295,165 300,155 
             C 290,165 280,190 280,210 
             C 280,225 270,235 265,240 Z" 
          fill="url(#fireGrad)" />

    <!-- Golden Dragon Arching Over Circle -->
    <!-- Dragon Ring & Tail -->
    <path d="M 125,240 A 125,125 0 0,0 250,365 A 125,125 0 0,0 375,240" 
          stroke="url(#goldGrad)" stroke-width="12" fill="none" stroke-linecap="round" />
    
    <!-- Dragon Tail curl (Right Side) -->
    <path d="M 370,230 
             C 385,200 410,180 430,200 
             C 440,215 425,240 395,245 
             C 375,248 350,235 340,215" 
          stroke="url(#goldGrad)" stroke-width="9" fill="none" stroke-linecap="round" />

    <!-- Dragon Body (Top Arch) -->
    <path d="M 130,230 
             C 125,160 180,105 250,105 
             C 300,105 345,130 365,175" 
          stroke="url(#goldGrad)" stroke-width="14" fill="none" stroke-linecap="round" />

    <!-- Dragon Back Spikes / Horns -->
    <path d="M 200,115 L 195,95 L 210,110
             M 230,107 L 230,85 L 242,105
             M 260,107 L 265,85 L 272,105
             M 290,115 L 300,95 L 298,118
             M 320,130 L 335,115 L 328,135" 
          fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Dragon Neck & Head (Left) -->
    <path d="M 140,210 
             C 145,170 170,140 185,120 
             C 170,100 150,85 130,95
             C 115,102 105,115 110,118
             C 115,120 125,115 135,118
             C 120,125 115,135 125,145
             C 135,155 140,175 140,210 Z" 
          fill="url(#goldGrad)" />

    <!-- Dragon Head Detail: Snout, Jaw & Eye -->
    <path d="M 130,95 
             C 110,90 95,100 85,108
             C 95,115 105,112 115,115
             C 105,120 95,125 90,130
             C 102,130 115,125 125,120
             C 135,115 145,105 140,95 Z" 
          fill="url(#goldGrad)" />
    <!-- Dragon Eye -->
    <circle cx="118" cy="103" r="2.5" fill="#a00" />
    <!-- Dragon Crown Horns -->
    <path d="M 135,92 C 145,75 160,65 170,60 C 160,75 152,85 142,92 Z" fill="url(#goldGrad)" />
    <path d="M 145,95 C 160,85 175,78 185,75 C 175,88 165,95 152,98 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Golden Frame Border Ring -->
  <circle cx="250" cy="250" r="235" stroke="url(#goldGrad)" stroke-width="4" fill="none" opacity="0.8" />
</svg>
